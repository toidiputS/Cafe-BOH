<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bridge BOH" />
    <meta name="description" content="Bridge Café Back of House Operations" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/192/192408.png" />
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/192/192408.png" type="image/png" />
    
    <title>Bridge BOH - Back of House Operations</title>
  </head>
  <body class="bg-[#0A0A0A] text-white selection:bg-amber-500/30 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered on scope:', reg.scope))
            .catch(err => console.warn('Service Worker registration skipped/failed:', err));
        });
      }
    </script>
  </body>
</html>
